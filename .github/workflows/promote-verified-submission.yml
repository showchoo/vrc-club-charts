name: Promote verified submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  promote:
    if: github.event.label.name == 'verified'
    runs-on: ubuntu-latest
    steps:
      - name: Create catalog PR
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || "";
            const body = issue.body || "";

            function field(label) {
              const marker = "### " + label;
              const start = body.indexOf(marker);
              if (start < 0) return "";
              const valueStart = start + marker.length;
              const next = body.indexOf("\n### ", valueStart);
              const raw = body.slice(valueStart, next < 0 ? body.length : next).trim();
              return /^_No response_$/i.test(raw) ? "" : raw;
            }

            function slug(value, fallback) {
              const s = String(value || "")
                .normalize("NFKD")
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 54);
              return s || fallback;
            }

            async function getJson(path) {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "main",
              });
              return {
                path,
                sha: file.data.sha,
                data: JSON.parse(Buffer.from(file.data.content, "base64").toString("utf8")),
              };
            }

            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });

            const issueNo = issue.number;
            let kind = "";
            let summary = "";
            let writes = [];

            if (title.startsWith("[World]")) {
              kind = "world";
              const worldId = (field("VRChat World ID").match(/wrld_[0-9a-fA-F-]{36}/) || [])[0];
              const name = field("World name");
              const author = field("Creator / author");
              if (!worldId || !name || !author) throw new Error("Missing valid world ID, name, or author.");

              const checked = field("Categories")
                .split("\n")
                .filter(line => /^- \[x\]/i.test(line))
                .map(line => line.replace(/^- \[x\]\s*/i, "").trim());
              const categoryMap = {
                "Club":"CLUB",
                "DJ":"DJ",
                "Music":"MUSIC",
                "Rave":"RAVE",
                "AudioLink":"AUDIOLINK",
                "Event venue":"EVENT",
                "Quest compatible":"QUEST",
                "Other":"OTHER"
              };
              const genres = [...new Set(checked.map(x => categoryMap[x]).filter(Boolean))];

              const registry = await getJson("data/worlds.json");
              if (registry.data.some(w => w.id === worldId)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNo,
                  body: `Cannot create a listing PR: \`${worldId}\` is already tracked.`
                });
                return;
              }
              const chartEligible = genres.some(g => ["CLUB","DJ","RAVE","NIGHT","EVENT"].includes(g));
              registry.data.push({ id: worldId, name, author, genres, editorialStatus: "unreviewed", chartEligible });

              const ranking = await getJson("data/weekly-ranking.json");
              ranking.data.worlds.push({
                id: worldId,
                name,
                author,
                genres,
                editorialStatus: "unreviewed",
                chartEligible,
                availabilityStatus: "available",
                releaseStatus: null,
                thumbnail: null,
                capacity: null,
                recommendedCapacity: null,
                worldUpdatedAt: null,
                totals: { visits: null, favorites: null },
                weekly: { visits: null, favorites: null },
                scores: { trending: 0.0, craftsmanship: null, overall: null },
                movement: { overall: null, trending: null, craftsmanship: null }
              });

              writes = [registry, ranking];
              summary = `Add world: ${name}`;

            } else if (title.startsWith("[Event]")) {
              kind = "event";
              const name = field("Event name");
              const startRaw = field("Start date and time");
              const organizer = field("Organizer / group");
              const worldName = field("World / instance name");
              const worldIdMatch = field("VRChat World ID").match(/wrld_[0-9a-fA-F-]{36}/);
              const publicLink = field("Public event link");
              const genres = field("Genres / style")
                .split(/[,/]/)
                .map(s => s.trim().toUpperCase())
                .filter(Boolean);
              if (!name || !startRaw || !organizer || !worldName || !publicLink) {
                throw new Error("Missing required event fields.");
              }

              let start = startRaw.trim();
              const jst = start.match(/^(\d{4}-\d{2}-\d{2})[ T](\d{1,2}:\d{2})\s*JST$/i);
              if (jst) start = `${jst[1]}T${jst[2]}:00+09:00`;
              if (Number.isNaN(Date.parse(start))) {
                throw new Error("Start time must be ISO 8601 or YYYY-MM-DD HH:MM JST.");
              }

              const file = await getJson("data/events.json");
              const id = `${slug(name, "event")}-${start.slice(0,10)}-${issueNo}`.slice(0,95);
              if (file.data.some(e => e.id === id)) throw new Error("Generated event id already exists.");

              const entry = {
                id,
                name,
                start,
                organizer,
                worldName,
                genres,
                url: publicLink,
                source: `Verified community submission #${issueNo}`
              };
              if (worldIdMatch) entry.worldId = worldIdMatch[0];
              file.data.push(entry);
              file.data.sort((a,b) => String(a.start).localeCompare(String(b.start)));

              writes = [file];
              summary = `Add event: ${name}`;

            } else if (title.startsWith("[DJ]")) {
              kind = "dj";
              const name = field("DJ / artist name");
              const genres = field("Main genres")
                .split(/[,/]/)
                .map(s => s.trim().toUpperCase())
                .filter(Boolean);
              const affiliation = field("Crew / event / community affiliation");
              const publicLink = field("Public profile or music link");
              if (!name || !genres.length || !publicLink) throw new Error("Missing required DJ fields.");

              const file = await getJson("data/djs.json");
              let id = slug(name, `dj-${issueNo}`);
              if (file.data.some(d => d.id === id)) id = `${id}-${issueNo}`.slice(0,63);

              file.data.push({
                id,
                name,
                role: "DJ / Artist",
                affiliations: affiliation ? [affiliation] : [],
                genres,
                source: publicLink
              });

              writes = [file];
              summary = `Add DJ: ${name}`;

            } else {
              return;
            }

            const branch = `submission/${kind}-${issueNo}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branch}`,
                sha: main.data.commit.sha,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            for (const write of writes) {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: write.path,
                branch,
                message: `submission: ${summary}`,
                sha: write.sha,
                content: Buffer.from(JSON.stringify(write.data, null, 2) + "\n").toString("base64"),
              });
            }

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: "main",
              title: `[Verified submission] ${summary}`,
              body: `Generated from verified issue #${issueNo}. Review the diff and CI before merging.\n\nCloses #${issueNo}`,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNo,
              body: `Verified submission PR created: #${pr.data.number}`
            });
