name: Promote verified submission

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  promote:
    if: github.event.label.name == 'verified'
    runs-on: ubuntu-latest
    steps:
      - name: Create catalog PR
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title || "";
            const body = issue.body || "";

            function field(label) {
              const marker = "### " + label;
              const start = body.indexOf(marker);
              if (start < 0) return "";
              const valueStart = start + marker.length;
              const next = body.indexOf("\n### ", valueStart);
              const raw = body.slice(valueStart, next < 0 ? body.length : next).trim();
              return /^_No response_$/i.test(raw) ? "" : raw;
            }

            function slug(value, fallback) {
              const s = String(value || "")
                .normalize("NFKD")
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, "-")
                .replace(/^-+|-+$/g, "")
                .slice(0, 54);
              return s || fallback;
            }

            async function getJson(path) {
              const file = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "main",
              });
              return {
                path,
                sha: file.data.sha,
                data: JSON.parse(Buffer.from(file.data.content, "base64").toString("utf8")),
              };
            }

            const main = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: "main",
            });

            const issueNo = issue.number;
            let kind = "";
            let summary = "";
            let writes = [];

            if (title.startsWith("[World]")) {
              kind = "world";
              const worldId = (field("VRChat World ID").match(/wrld_[0-9a-fA-F-]{36}/) || [])[0];
              const name = field("World name");
              const author = field("Creator / author");
              if (!worldId || !name || !author) throw new Error("Missing valid world ID, name, or author.");

              const checked = field("Categories")
                .split("\n")
                .filter(line => /^- \[x\]/i.test(line))
                .map(line => line.replace(/^- \[x\]\s*/i, "").trim());
              const categoryMap = {
                "Club":"CLUB",
                "DJ":"DJ",
                "Music":"MUSIC",
                "Rave":"RAVE",
                "AudioLink":"AUDIOLINK",
                "Event venue":"EVENT",
                "Quest compatible":"QUEST",
                "Other":"OTHER"
              };
              const genres = [...new Set(checked.map(x => categoryMap[x]).filter(Boolean))];

              const registry = await getJson("data/worlds.json");
              if (registry.data.some(w => w.id === worldId)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNo,
                  body: `Cannot create a listing PR: \`${worldId}\` is already tracked.`
                });
                return;
              }
              const chartEligible = genres.some(g => ["CLUB","DJ","RAVE","NIGHT","EVENT"].includes(g));
              registry.data.push({ id: worldId, name, author, genres, editorialStatus: "unreviewed", chartEligible });

              const ranking = await getJson("data/weekly-ranking.json");
              ranking.data.worlds.push({
                id: worldId,
                name,
                author,
                genres,
                editorialStatus: "unreviewed",
                chartEligible,
                availabilityStatus: "available",
                releaseStatus: null,
                thumbnail: null,
                capacity: null,
                recommendedCapacity: null,
                worldUpdatedAt: null,
                totals: { visits: null, favorites: null },
                weekly: { visits: null, favorites: null },
                scores: { trending: 0.0, craftsmanship: null, overall: null },
                movement: { overall: null, trending: null, craftsmanship: null }
              });

              writes = [registry, ranking];
              summary = `Add world: ${name}`;

            } else if (title.startsWith("[Event]")) {
              kind = "event";
              const name = field("Event name");
              const startRaw = field("Start date and time");
              const organizer = field("Organizer / group");
              const worldName = field("World / instance name");
              const worldIdMatch = field("VRChat World ID").match(/wrld_[0-9a-fA-F-]{36}/);
              const publicLink = field("Public event link");
              const genres = field("Genres / style")
                .split(/[,/]/)
                .map(s => s.trim().toUpperCase())
                .filter(Boolean);
              if (!name || !startRaw || !organizer || !worldName || !publicLink) {
                throw new Error("Missing required event fields.");
              }

              let start = startRaw.trim();
              const jst = start.match(/^(\d{4}-\d{2}-\d{2})[ T](\d{1,2}:\d{2})\s*JST$/i);
              if (jst) start = `${jst[1]}T${jst[2]}:00+09:00`;
              if (Number.isNaN(Date.parse(start))) {
                throw new Error("Start time must be ISO 8601 or YYYY-MM-DD HH:MM JST.");
              }

              const file = await getJson("data/events.json");
              const id = `${slug(name, "event")}-${start.slice(0,10)}-${issueNo}`.slice(0,95);
              if (file.data.some(e => e.id === id)) throw new Error("Generated event id already exists.");

              const entry = {
                id,
                name,
                start,
                organizer,
                worldName,
                genres,
                url: publicLink,
                source: `Verified community submission #${issueNo}`
              };
              if (worldIdMatch) entry.worldId = worldIdMatch[0];
              file.data.push(entry);
              file.data.sort((a,b) => String(a.start).localeCompare(String(b.start)));

              writes = [file];
              summary = `Add event: ${name}`;

            } else if (title.startsWith("[DJ]")) {
              kind = "dj";
              const name = field("DJ / artist name");
              const genres = field("Main genres")
                .split(/[,/]/)
                .map(s => s.trim().toUpperCase())
                .filter(Boolean);
              const affiliation = field("Crew / event / community affiliation");
              const publicLink = field("Public profile or music link");
              if (!name || !genres.length || !publicLink) throw new Error("Missing required DJ fields.");

              const file = await getJson("data/djs.json");
              let id = slug(name, `dj-${issueNo}`);
              if (file.data.some(d => d.id === id)) id = `${id}-${issueNo}`.slice(0,63);

              file.data.push({
                id,
                name,
                role: "DJ / Artist",
                affiliations: affiliation ? [affiliation] : [],
                genres,
                source: publicLink
              });

              writes = [file];
              summary = `Add DJ: ${name}`;

            } else if (title.startsWith("[Reviewer]")) {
              kind = "reviewer";
              const name = field("VRChat display name");
              if (!name) throw new Error("Missing VRChat display name.");

              const tags = field("Relevant experience")
                .split("\n")
                .filter(line => /^- \[x\]/i.test(line))
                .map(line => line.replace(/^- \[x\]\s*/i, "").trim())
                .map(label => ({
                  "Clubber / regular VRChat nightlife attendee": "clubber",
                  "DJ": "dj",
                  "VJ / lighting": "vj-lighting",
                  "World creator": "world-creator",
                  "Event staff / organizer": "event-staff-organizer",
                  "Other relevant experience": "other",
                })[label])
                .filter(Boolean);

              const affiliations = field("Worlds / groups you are directly affiliated with")
                .split("\n")
                .map(line => line.replace(/^[-*]\s*/, "").trim())
                .filter(Boolean);

              const file = await getJson("data/reviewers.json");
              const duplicate = file.data.find(r =>
                String(r.name || "").trim().toLocaleLowerCase() === name.trim().toLocaleLowerCase()
              );
              if (duplicate) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNo,
                  body: `Cannot create a reviewer PR: **${name}** is already registered as \`${duplicate.id}\`.`
                });
                return;
              }

              let id = `reviewer-${slug(name, `applicant-${issueNo}`)}`.slice(0, 63);
              if (file.data.some(r => r.id === id)) {
                const suffix = `-${issueNo}`;
                id = `${id.slice(0, 63 - suffix.length)}${suffix}`;
              }

              file.data.push({
                id,
                name,
                status: "active",
                tags: [...new Set(tags)],
                affiliations: [...new Set(affiliations)],
                approvedAt: new Date().toISOString(),
              });
              file.data.sort((a, b) => String(a.id).localeCompare(String(b.id)));

              writes = [file];
              summary = `Add reviewer: ${name}`;

            } else if (title.startsWith("[Review]")) {
              kind = "review";
              const reviewerId = field("Reviewer ID").trim();
              const worldId = field("VRChat World ID").trim();
              if (!reviewerId) throw new Error("Missing Reviewer ID.");
              if (!/^wrld_[0-9a-fA-F-]{36}$/.test(worldId)) throw new Error("Invalid VRChat World ID.");

              const scoreDefs = [
                ["visual", "Visual score (0-20)", 20],
                ["lighting", "Lighting & VJ score (0-20)", 20],
                ["sound", "Sound score (0-15)", 15],
                ["spatial", "Spatial score (0-15)", 15],
                ["interaction", "Interaction score (0-10)", 10],
                ["originality", "VR Originality score (0-10)", 10],
                ["optimization", "Optimization score (0-10)", 10],
              ];
              const scores = {};
              for (const [key, label, maximum] of scoreDefs) {
                const raw = field(label).trim();
                const value = Number(raw);
                if (!raw || !Number.isFinite(value) || value < 0 || value > maximum) {
                  throw new Error(`${label} must be a number from 0 to ${maximum}.`);
                }
                scores[key] = value;
              }
              if (Object.values(scores).reduce((sum, value) => sum + value, 0) > 100) {
                throw new Error("Review total cannot exceed 100.");
              }

              const conflictRaw = field("Conflict of interest").trim();
              if (!/^(No|Yes\b)/i.test(conflictRaw)) {
                throw new Error("Conflict of interest must explicitly be Yes or No.");
              }
              const conflict = /^Yes\b/i.test(conflictRaw);

              const reviewedAtRaw = field("Review date").trim();
              let reviewedAt = reviewedAtRaw;
              if (/^\d{4}-\d{2}-\d{2}$/.test(reviewedAtRaw)) {
                reviewedAt = `${reviewedAtRaw}T00:00:00Z`;
              } else if (!reviewedAtRaw || Number.isNaN(Date.parse(reviewedAtRaw))) {
                throw new Error("Review date must be YYYY-MM-DD or a valid ISO 8601 date/time.");
              } else {
                reviewedAt = new Date(reviewedAtRaw).toISOString();
              }

              const reviewers = await getJson("data/reviewers.json");
              const reviewer = reviewers.data.find(r => r.id === reviewerId);
              if (!reviewer) throw new Error(`Unknown Reviewer ID: ${reviewerId}`);
              if (reviewer.status !== "active") throw new Error(`Reviewer is not active: ${reviewerId}`);

              const worlds = await getJson("data/worlds.json");
              const world = worlds.data.find(w => w.id === worldId);
              if (!world) throw new Error(`World is not tracked: ${worldId}`);

              const file = await getJson("data/reviews.json");
              const id = `review-${issueNo}`;
              if (file.data.some(r => r.id === id)) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNo,
                  body: `Cannot create another review PR: \`${id}\` is already stored.`
                });
                return;
              }

              const entry = {
                id,
                worldId,
                reviewerId,
                conflict,
                status: "published",
                reviewedAt,
                scores,
                comment: field("Review comment").trim(),
                sourceIssue: issueNo,
              };
              file.data.push(entry);
              file.data.sort((a, b) => {
                const byWorld = String(a.worldId).localeCompare(String(b.worldId));
                if (byWorld) return byWorld;
                const byReviewer = String(a.reviewerId).localeCompare(String(b.reviewerId));
                if (byReviewer) return byReviewer;
                return String(a.reviewedAt).localeCompare(String(b.reviewedAt));
              });

              writes = [file];
              summary = `Add review: ${reviewerId} → ${world.name}`;

            } else {
              return;
            }

            const branch = `submission/${kind}-${issueNo}`;
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/heads/${branch}`,
                sha: main.data.commit.sha,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            for (const write of writes) {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: write.path,
                branch,
                message: `submission: ${summary}`,
                sha: write.sha,
                content: Buffer.from(JSON.stringify(write.data, null, 2) + "\n").toString("base64"),
              });
            }

            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: "main",
              title: `[Verified submission] ${summary}`,
              body: `Generated from verified issue #${issueNo}. Review the diff and CI before merging.\n\nCloses #${issueNo}`,
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNo,
              body: `Verified submission PR created: #${pr.data.number}`
            });
