name: AI research DJ livestream World evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/dj_stream_research.py"
      - "tests/test_dj_stream_research.py"
      - ".github/workflows/dj-stream-research.yml"
  schedule:
    # Daily 04:27 JST. Search grounding is billed per query; cap World count.
    - cron: "27 19 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: vcc-dj-stream-evidence-research
  cancel-in-progress: false

jobs:
  collect-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify grounded-source and no-auto-publication safety tests
        run: python -m unittest discover -s tests -p "test_dj_stream_research.py"

      - name: Research public DJ livestream evidence, never auto-approve
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VCC_DJ_RESEARCH_MODEL: "gemini-3.5-flash-lite"
          VCC_DJ_RESEARCH_MAX_PER_RUN: "4"
        run: |
          python scripts/dj_stream_research.py \
            --max-worlds 4 \
            --notice-output /tmp/vcc-dj-new-evidence.md

      - name: Commit research queue (catalog and approval registry unchanged)
        run: |
          git config user.name "vrc-club-charts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dj-stream-research.json
          if git diff --cached --quiet; then
            echo "No research changes"
          else
            git commit -m "data: research DJ live playback evidence for World candidates"
            git pull --rebase origin main
            git push
          fi

      - name: Notify owner when NEW grounded evidence requires checking
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/vcc-dj-new-evidence.md ]; then
            gh issue create \
              --title "[VCC] DJ配信対応の根拠候補を確認してください" \
              --body-file /tmp/vcc-dj-new-evidence.md
          else
            echo "No new substantial evidence to notify"
          fi
