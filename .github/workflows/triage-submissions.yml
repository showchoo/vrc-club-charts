name: Triage submissions

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Triage submission
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title || "";
            const body = context.payload.issue.body || "";
            const defs = [
              { prefix: "[World]", name: "world-submission", color: "17c6ef", description: "VRChat world listing submission" },
              { prefix: "[Event]", name: "event-submission", color: "8ceaff", description: "VRChat event calendar submission" },
              { prefix: "[DJ]", name: "dj-submission", color: "d8ff3e", description: "VRChat DJ directory submission" },
            ];
            const match = defs.find(d => title.startsWith(d.prefix));
            if (!match) return;

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  color,
                  description,
                });
              }
            }

            await ensureLabel(match.name, match.color, match.description);
            await ensureLabel("needs-verification", "f0c36d", "Submission needs source and identity verification");

            const labels = [match.name, "needs-verification"];
            let comment = [
              "Thanks for the submission.",
              "",
              "**Verification queue**",
              "- Confirm the public source / identity",
              "- Check for duplicates",
              "- Confirm World / Event / DJ relationships",
              "- Editorial scoring is never assigned automatically",
            ].join("\n");

            if (match.name === "world-submission") {
              const idMatch = body.match(/wrld_[0-9a-fA-F-]{36}/);
              if (idMatch) {
                const worldId = idMatch[0];
                const file = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: "data/worlds.json",
                });
                const json = Buffer.from(file.data.content, "base64").toString("utf8");
                const worlds = JSON.parse(json);
                const duplicate = worlds.find(w => w.id === worldId);
                if (duplicate) {
                  await ensureLabel("duplicate", "8b949e", "Already present in the catalog");
                  labels.push("duplicate");
                  comment += `\n\n⚠️ **Already tracked:** ${duplicate.name} (${worldId}). This issue can still be used to suggest metadata corrections or a review.`;
                } else {
                  comment += `\n\nWorld ID detected: \`${worldId}\` — not currently in the catalog.`;
                }
              } else {
                comment += "\n\n⚠️ No valid `wrld_...` ID was detected automatically.";
              }
            }

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [...new Set(labels)],
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });
