name: Update weekly rankings

on:
  workflow_dispatch:
  schedule:
    # Weekly; snapshot.py also adds 0–15 min jitter before the first request.
    - cron: "23 18 * * 0"

permissions:
  contents: write

concurrency:
  group: update-weekly-rankings
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Capture conservative VRChat snapshot
        env:
          VRC_USER_AGENT: VRCClubCharts/0.3 https://github.com/showchoo/vrc-club-charts
        run: python scripts/snapshot.py
      - name: Build weekly chart
        run: python scripts/build_rankings.py
      - name: Commit changed data
        run: |
          git config user.name "vrc-club-charts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots data/weekly-ranking.json
          git diff --cached --quiet && exit 0
          git commit -m "data: update weekly rankings"
          git push
