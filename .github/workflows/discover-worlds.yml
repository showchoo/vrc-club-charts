name: Discover new club Worlds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/discover_worlds.py"
      - "scripts/build_discovery_ledger.py"
      - "data/events.json"
      - "data/events-auto.json"
      - "scripts/discover_vrcw.py"
      - "scripts/discover_official.py"
      - "data/discovery-seeds.json"
      - ".github/workflows/discover-worlds.yml"
  schedule:
    # Daily at 02:47 JST. Candidate discovery is lightweight and does not call VRChat search APIs.
    - cron: "47 17 * * *"

permissions:
  contents: write

concurrency:
  group: discover-club-worlds
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover public club candidates
        env:
          VRC_USER_AGENT: ${{ vars.VRC_USER_AGENT }}
          VCC_DISCOVERY_PAGES_PER_SOURCE: "12"
          VCC_DISCOVERY_VERIFY_PER_RUN: "16"
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/discover_worlds.py
          python scripts/build_rankings.py
          python scripts/build_discovery_ledger.py
          python scripts/sync_discovery_to_supabase.py
      - name: Commit candidate queue
        run: |
          git config user.name "vrc-club-charts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/world-candidates.json data/discovery-state.json data/worlds.json data/weekly-ranking.json data/world-discovery-ledger.json data/discovery-report.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh World discovery candidates"
          git pull --rebase origin main
          git push
