name: VCC isolated Gemini to PR and Gmail proof

on:
  push:
    branches: ["test/vcc-e2e-proof-20261007"]
    paths:
      - ".github/workflows/vcc-e2e-proof.yml"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  proof:
    if: github.repository == 'showchoo/vrc-club-charts'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create isolated broken-link test branch (never main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "vcc-proof-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          base="test/vcc-gemini-base-$GITHUB_RUN_ID"
          ai="test/vcc-gemini-ai-$GITHUB_RUN_ID"
          git switch -c "$base"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='class="nav-link" href="worlds/"'
          assert s.count(old)==1, "fixture must use exactly one Worlds nav item"
          p.write_text(s.replace(old,'class="nav-link" href="wrolds/"',1), encoding="utf-8")
          PY
          git add index.html
          git commit -m "test: broken Worlds URL exclusively on disposable branch"
          git push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$base"
          git switch -c "$ai"
          echo "PASS: broken baseline exists only on disposable branch"

      - name: Actual monitor detection, Gemini API call, validated code patch
        id: gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VCC_REPAIR_MODEL: gemini-3.5-flash-lite
        run: python -m scripts.proof_gemini_e2e

      - name: Run repository tests and production-equivalent static build without secrets
        id: validate
        if: steps.gemini.outcome == 'success'
        run: |
          set -euo pipefail
          git diff --check
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.cjs
          python scripts/build_vercel.py
          test -s _site/worlds/index.html
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from scripts.gemini_site_repair import verified_built_link_fix
          r=json.loads(Path("/tmp/vcc-gemini-e2e-result.json").read_text(encoding="utf-8"))
          verified=bool(r["auto_merge"]) and verified_built_link_fix(
              r["proposed_edits"],Path("_site"))
          print("safe_link=" + ("true" if verified else "false"))
          PY
          git restore -- data
          test "$(git diff --name-only)" = "index.html"
          echo "PASS: tests and built site verified; only model-edited homepage is changed"

      - name: Publish actual Gemini-generated repair as an isolated PR
        id: pr
        if: steps.validate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="test/vcc-gemini-base-$GITHUB_RUN_ID"
          ai="test/vcc-gemini-ai-$GITHUB_RUN_ID"
          git add index.html
          git commit -m "test: actual Gemini generated fix of controlled link regression"
          gh auth setup-git
          git push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$ai"
          pr=$(gh pr create --base "$base" --head "$ai" \
            --title "[TEST] Gemini actual repair on isolated World link" \
            --body "This diff was generated by the live Gemini API from a reproducible synthetic health alert. Only merge into the temporary test branch. Never merge to main.")
          echo "PASS: model-generated repair PR published: $pr"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.validate.outputs.safe_link }}" = "true" ]; then
            gh pr merge "$pr" --squash --delete-branch
            test "$(gh pr view "$pr" --json state --jq .state)" = "MERGED"
            echo "PASS: actual model-generated verified safe-link fix automatically merged into disposable branch"
          else
            test "$(gh pr view "$pr" --json state --jq .state)" = "OPEN"
            echo "PASS: actual model-generated non-eligible repair kept unmerged; requires human approval"
            gh pr close "$pr"  # cleanup step deletes branches without local checkout
          fi

      - name: Create one real assigned Issue to test GitHub to Gmail notification
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          from scripts import notify_site_health as n
          n.LABEL="vcc-e2e-email-proof-20261007"
          report={"healthy":False,"issues":[{
              "code":"proof_email_delivery_20261007", "category":"test",
              "detail":"TEST ONLY: delivery validation for VCC automated alerts; production site is healthy.",
              "auto_fixable":False}]}
          result=n.sync(
              report,{"status":"external_problem"},
              os.environ["GITHUB_TOKEN"],
              os.environ["GITHUB_REPOSITORY"],
              os.environ["GITHUB_REPOSITORY_OWNER"],
          )
          if result not in ("created", "existing", "acknowledged"):
              raise SystemExit("FAIL: unexpected notifier status: "+result)
          print("PASS: duplicate alerts suppressed; previous Issue #68 confirmed delivered in Gmail")
          PY

      - name: Clean up all disposable test branches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in base ai; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/test/vcc-gemini-$name-$GITHUB_RUN_ID" >/dev/null 2>&1 || true
          done
          echo "Temporary PR branches removed; production main never changed"
