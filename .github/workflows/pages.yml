name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "about.html"
      - "privacy.html"
      - "app.js"
      - "styles.css"
      - "favicon.svg"
      - "site.webmanifest"
      - "robots.txt"
      - "sitemap.xml"
      - "scripts/build_static_pages.py"
      - "data/events.json"
      - "events.js"
      - "events.html"
      - "data/weekly-ranking.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare public artifact
        run: |
          mkdir _site
          cp index.html about.html privacy.html events.html app.js events.js styles.css favicon.svg site.webmanifest robots.txt _site/
          mkdir -p _site/data
          cp data/weekly-ranking.json _site/data/
          cp data/events.json _site/data/
          python scripts/build_static_pages.py _site
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
