name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "about.html"
      - "privacy.html"
      - "reviewer.html"
      - "world-submission.js"
      - "reviewer-admin.html"
      - "app.js"
      - "i18n.js"
      - "analytics.js"
      - "ai-scout.js"
      - "community-reviews.js"
      - "data/ai-scout.json"
      - "scripts/build_ai_scout.py"
      - "styles.css"
      - "favicon.svg"
      - "site.webmanifest"
      - "robots.txt"
      - "sitemap.xml"
      - "scripts/build_static_pages.py"
      - "scripts/build_og_image.py"
      - "data/events.json"
      - "data/events-auto.json"
      - "scripts/import_event_feed.py"
      - "events.js"
      - "data/djs.json"
      - "djs.js"
      - "djs.html"
      - "events.html"
      - "data/worlds.json"
      - "data/weekly-ranking.json"
      - "scripts/build_review_scores.py"
      - "scripts/sync_reviewers_from_supabase.py"
      - "scripts/sync_reviews_from_supabase.py"
      - "data/review-scores.json"
      - "data/reviews.json"
      - "data/reviewers.json"
      - "data/world-candidates.json"
      - "data/world-candidate-ai-decisions.json"
      - "data/world-submission-decisions.json"
      - "data/discovery-report.json"
      - "scripts/discover_worlds.py"
      - "scripts/sync_worlds_from_supabase.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["AI SCOUT automatic World discovery", "Discover new club Worlds", "Review submitted club Worlds"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare public artifact
        run: |
          python scripts/sync_worlds_from_supabase.py
          python scripts/build_rankings.py
          python scripts/sync_reviewers_from_supabase.py
          python scripts/sync_reviews_from_supabase.py
          python scripts/build_review_scores.py
          mkdir _site
          cp index.html about.html privacy.html reviewer.html reviewer-admin.html events.html djs.html app.js analytics.js i18n.js ai-scout.js community-reviews.js world-submission.js events.js djs.js styles.css favicon.svg site.webmanifest robots.txt _site/
          mkdir -p _site/data
          cp data/weekly-ranking.json _site/data/
          cp data/review-scores.json data/ai-scout.json _site/data/
          cp data/events.json _site/data/
          cp data/djs.json _site/data/
          cp data/world-candidates.json data/world-candidate-ai-decisions.json _site/data/
          cp data/discovery-report.json _site/data/
          python scripts/build_static_pages.py _site
          python scripts/build_og_image.py _site
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
