name: Validate catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "about.html"
      - "privacy.html"
      - "events.html"
      - "djs.html"
      - "app.js"
      - "i18n.js"
      - "analytics.js"
      - "ai-scout.js"
      - "community-reviews.js"
      - "world-submission.js"
      - "data/ai-scout.json"
      - "scripts/build_ai_scout.py"
      - "events.js"
      - "djs.js"
      - "styles.css"
      - "data/worlds.json"
      - "data/weekly-ranking.json"
      - "data/interior-visual-estimates.json"
      - "scripts/build_review_scores.py"
      - "scripts/sync_reviewers_from_supabase.py"
      - "scripts/sync_reviews_from_supabase.py"
      - "data/review-scores.json"
      - "data/world-candidates.json"
      - "data/world-candidate-ai-decisions.json"
      - "data/discovery-seeds.json"
      - "data/discovery-state.json"
      - "data/world-submission-decisions.json"
      - "data/world-discovery-ledger.json"
      - "data/discovery-report.json"
      - "tests/**"
      - "vercel.json"
      - ".vercelignore"
      - "scripts/build_vercel.py"
      - "scripts/discover_worlds.py"
      - "scripts/build_discovery_ledger.py"
      - "scripts/review_world_submissions.py"
      - "scripts/review_discovery_candidates.py"
      - "scripts/notify_pending_reviews.py"
      - "scripts/monitor_site_health.py"
      - "scripts/browser_health_probe.cjs"
      - "scripts/gemini_site_repair.py"
      - "scripts/notify_site_health.py"
      - ".github/workflows/site-self-heal.yml"
      - ".github/workflows/notify-pending-reviews.yml"
      - "scripts/sync_discovery_to_supabase.py"
      - "scripts/sync_worlds_from_supabase.py"
      - "data/reviews.json"
      - "data/reviewers.json"
      - "data/events.json"
      - "data/events-auto.json"
      - "data/djs.json"
      - "scripts/build_rankings.py"
      - "scripts/build_static_pages.py"
      - "scripts/build_og_image.py"
      - "scripts/import_event_feed.py"
      - "scripts/validate_catalog.py"
      - "reviewer.html"
      - "reviewer-admin.html"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "vercel.json"
      - ".vercelignore"
      - "data/worlds.json"
      - "data/weekly-ranking.json"
      - "data/interior-visual-estimates.json"
      - "data/discovery-seeds.json"
      - "data/discovery-state.json"
      - "data/world-discovery-ledger.json"
      - "data/discovery-report.json"
      - "tests/**"
      - "data/events.json"
      - "data/events-auto.json"
      - "data/djs.json"
      - "data/reviews.json"
      - "data/reviewers.json"
      - "data/review-scores.json"
      - "reviewer.html"
      - "scripts/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q scripts
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check scripts/browser_health_probe.cjs
          node --check i18n.js
          node --test tests/language-switch.test.cjs
          node --check analytics.js
          node --check ai-scout.js
          node --check community-reviews.js
          node --check world-submission.js
          node --check events.js
          node --check djs.js
          node --test tests/analytics-opt-out.test.cjs
          node --test tests/admin-candidate-render.test.cjs
          node --test tests/homepage-thumbnails.test.cjs
          node --check experiments/offline-camera/navigation.js
          node --check experiments/offline-camera/camera.js
          node --test tests/offline-camera.test.cjs
      - name: Test AI SCOUT catalog generation
        run: python -m unittest discover -s tests -p "test_*.py"
      # GitHub-hosted runners may no longer have FFmpeg, and Ubuntu apt
      # repositories can be unreachable. Do not make *all* static tests fail
      # after a 120-second apt timeout. A skipped media smoke is NOT a pass.
      - name: Check installed FFmpeg availability
        id: ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 \
            && command -v ffprobe >/dev/null 2>&1 \
            && ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
            echo "FFmpeg libx264 available; full synthetic MP4 test is required."
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::warning title=FFmpeg unavailable::Synthetic MP4 inspection smoke test was NOT executed; Python and site-build validation will continue."
          fi
      - name: Test real synthetic MP4 through offline inspection pipeline
        if: steps.ffmpeg.outputs.available == 'true'
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders 2>/dev/null | grep libx264
          python scripts/inspection_pipeline_smoketest.py
      - name: Record missing MP4 coverage prominently
        if: steps.ffmpeg.outputs.available != 'true'
        run: |
          echo "⚠️ FFmpeg/libx264 absent on this runner: the full synthetic MP4 pipeline was NOT tested. Python unit tests and static-site checks still run. Repeat on an FFmpeg-equipped runner before relying on video functionality." >> "${GITHUB_STEP_SUMMARY}"
      - name: Build discovery evidence snapshot
        run: python scripts/build_discovery_ledger.py
      - name: Sync approved Worlds
        run: |
          python scripts/sync_worlds_from_supabase.py
          python scripts/build_rankings.py
      - name: Sync approved reviewers
        run: python scripts/sync_reviewers_from_supabase.py
      - name: Sync approved reviews
        run: python scripts/sync_reviews_from_supabase.py
      - name: Build reviewer panel scores
        run: python scripts/build_review_scores.py
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Smoke-test static generation
        run: |
          mkdir -p /tmp/vcc-site
          cp styles.css favicon.svg /tmp/vcc-site/
          test -f reviewer.html
          test -f data/review-scores.json
          python scripts/build_static_pages.py /tmp/vcc-site
          python scripts/build_og_image.py /tmp/vcc-site
          test -f /tmp/vcc-site/worlds/index.html
          test -d /tmp/vcc-site/events
          test -d /tmp/vcc-site/djs
          test -f /tmp/vcc-site/events.ics
          test -f /tmp/vcc-site/sitemap.xml
          test -s /tmp/vcc-site/og-image.png
      - name: Smoke-test Vercel generated output
        run: |
          python scripts/build_vercel.py
          test -s _site/worlds/index.html
          test -s _site/i18n.js
          grep -q '../i18n.js' _site/worlds/index.html
          test -s _site/data/weekly-ranking.json
          test -s _site/index.html
          test -f _site/og-image.png
          test -s _site/sitemap.xml
          test -s _site/data/ai-scout.json
          grep -q "worlds/" _site/index.html

