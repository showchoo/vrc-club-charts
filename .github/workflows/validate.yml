name: Validate catalog

on:
  push:
    branches: [main]
    paths:
      - "data/worlds.json"
      - "data/weekly-ranking.json"
      - "data/events.json"
      - "data/djs.json"
      - "scripts/build_rankings.py"
      - "scripts/build_static_pages.py"
      - "scripts/validate_catalog.py"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/worlds.json"
      - "data/weekly-ranking.json"
      - "scripts/**"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q scripts
      - name: Validate catalog
        run: python scripts/validate_catalog.py
      - name: Smoke-test static generation
        run: |
          mkdir -p /tmp/vcc-site
          cp styles.css favicon.svg /tmp/vcc-site/
          python scripts/build_static_pages.py /tmp/vcc-site
          test -f /tmp/vcc-site/worlds/index.html
          test -d /tmp/vcc-site/events
          test -d /tmp/vcc-site/djs
          test -f /tmp/vcc-site/events.ics
          test -f /tmp/vcc-site/sitemap.xml
