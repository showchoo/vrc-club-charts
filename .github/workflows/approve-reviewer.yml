name: Approve reviewer

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: reviewer-approval
  cancel-in-progress: false

jobs:
  approve:
    if: github.event.label.name == 'verified' && startsWith(github.event.issue.title, '[Reviewer]')
    runs-on: ubuntu-latest
    steps:
      - name: Activate reviewer
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const body = issue.body || "";
            const login = String(issue.user?.login || "").toLowerCase();

            function field(label) {
              const marker = "### " + label;
              const start = body.indexOf(marker);
              if (start < 0) return "";
              const valueStart = start + marker.length;
              const next = body.indexOf("\n### ", valueStart);
              const raw = body.slice(valueStart, next < 0 ? body.length : next).trim();
              return /^_No response_$/i.test(raw) ? "" : raw;
            }

            function checked(label) {
              return field(label)
                .split("\n")
                .filter(line => /^- \[x\]/i.test(line))
                .map(line => line.replace(/^- \[x\]\s*/i, "").trim());
            }

            async function ensureLabel(name, color, description) {
              try {
                await github.rest.issues.getLabel({...context.repo, name});
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({...context.repo, name, color, description});
              }
            }

            if (!login) throw new Error("Reviewer application has no GitHub login.");

            const vrchatName = field("VRChat display name").trim();
            if (!vrchatName) throw new Error("Missing VRChat display name.");

            const tags = checked("Relevant experience").map(x => {
              if (/^Clubber/i.test(x)) return "CLUBBER";
              if (/^DJ$/i.test(x)) return "DJ";
              if (/^VJ/i.test(x)) return "VJ";
              if (/^World creator/i.test(x)) return "WORLD CREATOR";
              if (/^Event staff/i.test(x)) return "EVENT STAFF";
              return "OTHER";
            });

            let reviewerId = login.replace(/[^a-z0-9_-]+/g, "-").replace(/^-+|-+$/g, "");
            if (reviewerId.length < 2) reviewerId += "-r";
            reviewerId = reviewerId.slice(0, 63);

            const file = await github.rest.repos.getContent({
              ...context.repo,
              path: "data/reviewers.json",
              ref: "main",
            });
            const reviewers = JSON.parse(Buffer.from(file.data.content, "base64").toString("utf8"));

            const existingIndex = reviewers.findIndex(r =>
              String(r.id || "") === reviewerId ||
              String(r.github || "").toLowerCase() === login
            );

            const entry = {
              id: reviewerId,
              name: vrchatName,
              github: login,
              tags: [...new Set(tags)],
              status: "active",
              acceptedAt: new Date().toISOString(),
            };

            if (existingIndex >= 0) {
              entry.acceptedAt = reviewers[existingIndex].acceptedAt || entry.acceptedAt;
              reviewers[existingIndex] = {...reviewers[existingIndex], ...entry};
            } else {
              reviewers.push(entry);
            }

            reviewers.sort((a,b) => String(a.id).localeCompare(String(b.id)));

            await github.rest.repos.createOrUpdateFileContents({
              ...context.repo,
              path: "data/reviewers.json",
              branch: "main",
              message: `reviewer: activate ${reviewerId}`,
              sha: file.data.sha,
              content: Buffer.from(JSON.stringify(reviewers, null, 2) + "\n").toString("base64"),
            });

            await ensureLabel("reviewer-active", "3fd9ff", "Approved active Craftsmanship reviewer");
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: ["reviewer-active"],
            });

            try {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: issue.number,
                name: "needs-verification",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issue.number,
              body: [
                "Reviewer approved and activated.",
                "",
                `Reviewer ID: \`${reviewerId}\``,
                "",
                "You can now submit Craftsmanship reviews using the **Submit a craftsmanship review** issue form.",
                "For the same world, your newest published review replaces your previous published review in ranking calculations."
              ].join("\n"),
            });

            await github.rest.issues.update({
              ...context.repo,
              issue_number: issue.number,
              state: "closed",
            });
