name: Monitor site and attempt Gemini self-repair

on:
  workflow_dispatch:
    inputs:
      rehearsal:
        description: "Isolated Gemini/PR/email proof test (no production changes)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "scripts/monitor_site_health.py"
      - "scripts/gemini_site_repair.py"
      - "scripts/notify_site_health.py"
      - "tests/test_site_self_heal.py"
      - ".github/workflows/site-self-heal.yml"
  schedule:
    # Hourly. Gemini runs only for new, reproducible incidents.
    - cron: "41 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: vcc-gemini-site-self-heal
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ (github.event_name != 'workflow_dispatch' || !inputs.rehearsal) && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[vcc-one-time-rehearsal]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test monitor and guardrails
        run: python -m unittest discover -s tests -p "test_site_self_heal.py"

      - name: Check public production routes, images and feeds
        id: inspect_http
        run: python scripts/monitor_site_health.py --report /tmp/vcc-site-health.json

      - name: Decide whether to run browser visual smoke check
        id: browser_schedule
        run: |
          hour=$(date -u +%H)
          hour=$((10#$hour))
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] || [ $((hour % 6)) -eq 0 ]; then
            echo "probe=true" >> "$GITHUB_OUTPUT"
          else
            echo "probe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare headless browser (every 6 hours and manual runs)
        id: browser_setup
        if: steps.inspect_http.outcome == 'success' && steps.browser_schedule.outputs.probe == 'true'
        continue-on-error: true
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Check rendered images JavaScript and EN/JA switch
        if: steps.browser_setup.outcome == 'success'
        continue-on-error: true
        env:
          VCC_HEALTH_REPORT: /tmp/vcc-site-health.json
        run: node scripts/browser_health_probe.cjs

      - name: Read combined site health report
        id: health
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open("/tmp/vcc-site-health.json", encoding="utf-8"))
          print("unhealthy=" + ("false" if data["healthy"] else "true"))
          PY

      - name: Check existing incident to avoid repeated AI calls
        id: existing
        if: steps.health.outputs.unhealthy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&labels=vcc-site-health&per_page=50" \
            --jq '[.[] | select(has("pull_request") | not)] | length')
          if [ "$count" -gt 0 ]; then
            echo "incident_open=true" >> "$GITHUB_OUTPUT"
            echo "Incident already open: skip another Gemini call."
          else
            echo "incident_open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ask Gemini for a tightly bounded repair
        id: gemini
        if: steps.health.outputs.unhealthy == 'true' && steps.existing.outputs.incident_open != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VCC_REPAIR_MODEL: gemini-3.5-flash-lite
        run: |
          python scripts/gemini_site_repair.py \
            --report /tmp/vcc-site-health.json \
            --result /tmp/vcc-repair-result.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open("/tmp/vcc-repair-result.json", encoding="utf-8"))
          print("patch=" + ("true" if data["status"]=="patch_proposed" else "false"))
          print("auto_merge=" + ("true" if data["auto_merge"] else "false"))
          PY

      - name: Validate AI changes without giving tests any secret
        id: check_patch
        if: steps.gemini.outputs.patch == 'true'
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q scripts
          node --check app.js
          node --check ai-scout.js
          node --check i18n.js
          node --check events.js
          node --check djs.js
          node --check community-reviews.js
          node --check world-submission.js
          node --test tests/*.test.cjs
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/sync_worlds_from_supabase.py
          python scripts/build_rankings.py
          python scripts/sync_reviewers_from_supabase.py
          python scripts/sync_reviews_from_supabase.py
          python scripts/build_review_scores.py
          python scripts/validate_catalog.py
          python scripts/build_vercel.py
          test -s _site/worlds/index.html
          test -s _site/i18n.js
          test "$(find _site/worlds -maxdepth 1 -name 'wrld_*.html' | wc -l)" -gt 0
          test "$(grep -o 'world-thumb?id=wrld_' _site/worlds/index.html | wc -l)" -ge 80
          # Build inputs are reconstructed from Supabase and can legitimately
          # update local data files. These are never part of a repair proposal.
          git restore -- data
          # The AI must not mutate secrets, tests, workflows or catalog data.
          python - <<'PY'
          import json, subprocess
          from scripts.gemini_site_repair import ALLOW
          plan=json.load(open("/tmp/vcc-repair-result.json", encoding="utf-8"))
          changed=set(subprocess.check_output(["git","diff","--name-only"],text=True).splitlines())
          expected=set(plan["edits"])
          if changed!=expected or not changed.issubset(ALLOW):
              raise SystemExit(f"Unexpected generated change: {changed ^ expected}")
          print("Validated Gemini patch paths:", sorted(changed))
          PY

      - name: Confirm old link is broken and new target exists in built site
        id: link_guard
        if: steps.check_patch.outcome == 'success'
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          from scripts.gemini_site_repair import verified_built_link_fix
          result = json.load(open("/tmp/vcc-repair-result.json", encoding="utf-8"))
          verified = verified_built_link_fix(
              result.get("proposed_edits", []), Path("_site")
          )
          print("verified=" + ("true" if verified else "false"))
          PY

      - name: Create repair PR (auto-merge only for verified local links)
        id: publish
        if: steps.check_patch.outcome == 'success' && steps.link_guard.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="auto/vcc-gemini-repair-$GITHUB_RUN_ID"
          git config user.name "vcc-health-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- index.html about.html events.html djs.html reviewer.html \
            app.js ai-scout.js i18n.js styles.css \
            scripts/build_static_pages.py scripts/build_vercel.py vercel.json
          git diff --cached --quiet && exit 0
          git commit -m "fix: Gemini remediation for monitored site regression"
          gh auth setup-git
          git push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
          printf 'https://github.com/%s/tree/%s\n' "$GITHUB_REPOSITORY" "$branch" > /tmp/vcc-repair-branch.txt

          diagnosis=$(python - <<'PY'
          import json
          data=json.load(open("/tmp/vcc-repair-result.json",encoding="utf-8"))
          print(str(data.get("diagnosis",""))[:250].replace("\n"," "))
          PY
          )
          pr_url=""
          if pr_url=$(gh pr create \
              --base main --head "$branch" \
              --title "fix: Gemini repair for production site health alert" \
              --body "Generated in an isolated runner after public monitoring detected an issue.

          Diagnosis: $diagnosis

          Only bounded replacements in approved site files are permitted; all repository tests and Vercel build passed.

          IMPORTANT: Review code and actual browser behavior before merging unless this is an isolated internal-link correction."); then
            printf '%s\n' "$pr_url" > /tmp/vcc-repair-pr.txt
            echo "pr_url=$pr_url" >> "$GITHUB_OUTPUT"
            if [ "${{ steps.gemini.outputs.auto_merge }}" = "true" ] && [ "${{ steps.link_guard.outputs.verified }}" = "true" ]; then
              echo "Safe single-link replacement: attempting automatic squash merge."
              if gh pr merge "$pr_url" --squash --delete-branch; then
                echo "auto_merged=true" >> "$GITHUB_OUTPUT"
                # GITHUB_TOKEN commits do not automatically trigger other Actions.
                # Explicit dispatch keeps GitHub Pages synchronized with Vercel.
                gh workflow run pages.yml --ref main || echo "Pages dispatch unavailable; check deployment."
              else
                echo "Automated merge blocked by GitHub policy; PR remains for review."
              fi
            fi
          else
            echo "GitHub Actions PR creation is blocked; branch retained for owner."
            python - <<'PY'
          import json
          p="/tmp/vcc-repair-result.json"
          data=json.load(open(p,encoding="utf-8"))
          data["status"]="pr_permission_blocked"
          json.dump(data,open(p,"w",encoding="utf-8"))
          PY
          fi

      - name: Notify owner once or close recovered issue
        if: always() && steps.health.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          if [ "${{ steps.check_patch.outcome }}" = "failure" ]; then
            python - <<'PY'
          import json
          p="/tmp/vcc-repair-result.json"
          data=json.load(open(p, encoding="utf-8"))
          data["status"]="repair_tests_failed"
          json.dump(data,open(p,"w",encoding="utf-8"))
          PY
          fi
          python scripts/notify_site_health.py \
            --report /tmp/vcc-site-health.json \
            --repair /tmp/vcc-repair-result.json \
            --pr-url-file /tmp/vcc-repair-pr.txt \
            --branch-url-file /tmp/vcc-repair-branch.txt

  rehearsal:
    # Runs ONLY when a human explicitly requests the opt-in test mode.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.rehearsal) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[vcc-one-time-rehearsal]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test existing safety regression suite
        run: python -m unittest discover -s tests -p 'test_site_self_heal.py'

      - name: Real Gemini call on an isolated HTML fixture
        id: live_model
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VCC_REPAIR_MODEL: gemini-3.5-flash-lite
        run: python -m scripts.rehearse_site_self_heal_live

      - name: Create and merge a test PR into a disposable branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "vcc-health-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          base="test/vcc-heal-base-$GITHUB_RUN_ID"
          safe="test/vcc-heal-safe-$GITHUB_RUN_ID"
          manual="test/vcc-heal-manual-$GITHUB_RUN_ID"

          # Only the disposable base branch has the deliberate 404 link.
          git switch -c "$base"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          a='class="nav-link" href="worlds/"'
          assert s.count(a)==1, "expected exactly one navigation link"
          p.write_text(s.replace(a, 'class="nav-link" href="wrolds/"', 1), encoding="utf-8")
          PY
          git add index.html
          git commit -m "test: reproduce typo exclusively on disposable branch"
          git push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$base"

          # Repair the typo; PR target is emphatically not main.
          git switch -c "$safe"
          python - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          a='class="nav-link" href="wrolds/"'
          assert s.count(a)==1
          p.write_text(s.replace(a, 'class="nav-link" href="worlds/"', 1), encoding="utf-8")
          PY
          git add index.html
          git commit -m "test: fix disposable homepage link"
          git push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$safe"
          safe_pr=$(gh pr create --base "$base" --head "$safe"             --title "[TEST] Safe internal-link self-heal rehearsal"             --body "Isolated Actions permission/merge test. Never merge to main.")
          gh pr merge "$safe_pr" --squash --delete-branch
          test "$(gh pr view "$safe_pr" --json state --jq .state)" = "MERGED"
          echo "PASS: disposable repair PR created and merged into test branch only: $safe_pr"

          # A non-link change must stay unmerged, requiring human approval.
          git fetch origin "$base"
          git switch --detach "origin/$base"
          git switch -c "$manual"
          printf '\n/* isolated self-heal rehearsal; not for production */\n' >> styles.css
          git add styles.css
          git commit -m "test: manual approval required for CSS repair"
          git push "https://github.com/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$manual"
          manual_pr=$(gh pr create --base "$base" --head "$manual"             --title "[TEST] Non-link repair must require approval"             --body "Simulated CSS repair on disposable branch; intentionally NOT merged.")
          test "$(gh pr view "$manual_pr" --json state --jq .state)" = "OPEN"
          echo "PASS: non-link PR left unmerged for verification: $manual_pr"
          gh pr close "$manual_pr" --delete-branch
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$base"
          echo "PASS: disposable branches cleaned; main untouched."

      - name: Clean disposable branches even if PR permissions were rejected
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in "$GITHUB_RUN_ID" 37513011233; do
            for name in base safe manual; do
              branch="test/vcc-heal-$name-$run"
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null 2>&1 || true
            done
          done
          echo "Disposable rehearsal branch cleanup attempted"

      - name: Send and resolve one synthetic GitHub Issue alert
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import os
          from scripts import notify_site_health as n
          repo=os.environ["GITHUB_REPOSITORY"]
          token=os.environ["GITHUB_TOKEN"]
          owner=os.environ["GITHUB_REPOSITORY_OWNER"]
          existing=n.api("GET", f"/repos/{repo}/issues?state=open&labels={n.LABEL}&per_page=50", token)
          if any(isinstance(x,dict) and "pull_request" not in x for x in existing):
              raise SystemExit("Existing genuine incident present: no synthetic alert created")
          incident={"healthy":False, "issues":[{
              "code":"rehearsal_notification", "category":"test",
              "detail":"Controlled notification proof test. Production site is healthy.",
              "auto_fixable":False}]}
          created=n.sync(incident, {"status":"external_problem"}, token, repo, owner)
          try:
              assert created=="created", f"expected newly created Issue, got {created}"
          finally:
              n.sync({"healthy":True, "issues":[]}, {}, token, repo, owner)
          print("PASS: actual notifier created and closed test Issue; email delivery needs inbox verification")
          PY

      - name: Require live Gemini test to have succeeded
        if: always()
        run: test "${{ steps.live_model.outcome }}" = "success"
