name: Submit a VRChat club world
description: Suggest a public VRChat club / DJ / music world for VRC Club Charts.
title: "[WORLD] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping expand VRC Club Charts.
        Submission does not guarantee an editorial score or ranking position.

  - type: input
    id: world_name
    attributes:
      label: World name
      placeholder: e.g. Club Example
    validations:
      required: true

  - type: input
    id: world_id
    attributes:
      label: VRChat World ID
      description: Must start with wrld_
      placeholder: wrld_xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx
    validations:
      required: true

  - type: input
    id: author
    attributes:
      label: World author
      placeholder: Creator name
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Main type
      options:
        - Club
        - DJ venue
        - Music venue
        - Rave / festival
        - Live venue
        - AudioLink showcase
        - Other
    validations:
      required: true

  - type: checkboxes
    id: features
    attributes:
      label: Features
      options:
        - label: Quest compatible
        - label: AudioLink
        - label: DJ booth / decks
        - label: Stage lighting / VJ
        - label: Event venue
        - label: Dance floor

  - type: input
    id: reference
    attributes:
      label: Public reference URL
      description: VRChat, VRCW, creator page, event page, etc.
      placeholder: https://...
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: Why should it be listed?
      description: Short context, notable events, unique design, or why it fits the catalog.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I understand that listing does not guarantee an editorial score or ranking position.
          required: true
