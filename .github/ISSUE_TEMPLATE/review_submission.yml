name: Submit a craftsmanship review
description: Submit a scored VRChat club world review as an approved VRC Club Charts reviewer.
title: "[Review] "
body:
  - type: markdown
    attributes:
      value: |
        This form is for approved VRC Club Charts Reviewers.

        Visit the world before scoring it. One Reviewer × one World contributes at most one active score to the ranking; if you review the same World again, the newest published review replaces your older score in aggregation while preserving review history.

  - type: input
    id: reviewer_id
    attributes:
      label: Reviewer ID
      description: Your approved VRC Club Charts reviewer ID, e.g. reviewer-example.
      placeholder: reviewer-example
    validations:
      required: true

  - type: input
    id: world_id
    attributes:
      label: VRChat World ID
      description: Must begin with wrld_ and already exist in the VRC Club Charts catalog.
      placeholder: wrld_00000000-0000-0000-0000-000000000000
    validations:
      required: true

  - type: input
    id: visual
    attributes:
      label: Visual score (0-20)
      placeholder: "17.5"
    validations:
      required: true

  - type: input
    id: lighting
    attributes:
      label: Lighting & VJ score (0-20)
      placeholder: "18"
    validations:
      required: true

  - type: input
    id: sound
    attributes:
      label: Sound score (0-15)
      placeholder: "13"
    validations:
      required: true

  - type: input
    id: spatial
    attributes:
      label: Spatial score (0-15)
      placeholder: "12.5"
    validations:
      required: true

  - type: input
    id: interaction
    attributes:
      label: Interaction score (0-10)
      placeholder: "8"
    validations:
      required: true

  - type: input
    id: originality
    attributes:
      label: VR Originality score (0-10)
      placeholder: "9"
    validations:
      required: true

  - type: input
    id: optimization
    attributes:
      label: Optimization score (0-10)
      placeholder: "8.5"
    validations:
      required: true

  - type: dropdown
    id: conflict
    attributes:
      label: Conflict of interest
      description: Select Yes if you are the creator or directly affiliated with this World or its Group. The review is stored but excluded from ranking aggregation.
      options:
        - "No"
        - "Yes — I am directly affiliated with this World / Group"
    validations:
      required: true

  - type: input
    id: reviewed_at
    attributes:
      label: Review date
      description: Use YYYY-MM-DD, or an ISO 8601 date/time with timezone.
      placeholder: "2026-10-06"
    validations:
      required: true

  - type: textarea
    id: comment
    attributes:
      label: Review comment
      description: Briefly explain the strongest and weakest parts of the actual in-world experience.
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Required confirmations
      options:
        - label: I personally visited this World before submitting these scores.
          required: true
        - label: These scores reflect my own assessment using the seven published criteria.
          required: true
        - label: I have disclosed any direct creator / staff / group affiliation above.
          required: true
