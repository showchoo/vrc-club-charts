name: Submit a craftsmanship review
description: Submit a 7-criteria review for a tracked VRChat nightlife world.
title: "[Review] "
body:
  - type: markdown
    attributes:
      value: |
        This form is for approved VRC Club Charts reviewers.
        Visit the world before scoring it. Your newest published review replaces your previous published review for the same world.

        Score limits:
        - Visual: 0–20
        - Lighting & VJ: 0–20
        - Sound: 0–15
        - Spatial: 0–15
        - Interaction: 0–10
        - VR Originality: 0–10
        - Optimization: 0–10

  - type: input
    id: world_id
    attributes:
      label: VRChat World ID
      description: The tracked wrld_... ID.
      placeholder: wrld_00000000-0000-0000-0000-000000000000
    validations:
      required: true

  - type: input
    id: visual
    attributes:
      label: Visual — 0 to 20
      placeholder: "e.g. 17.5"
    validations:
      required: true

  - type: input
    id: lighting
    attributes:
      label: Lighting & VJ — 0 to 20
      placeholder: "e.g. 18"
    validations:
      required: true

  - type: input
    id: sound
    attributes:
      label: Sound — 0 to 15
      placeholder: "e.g. 13"
    validations:
      required: true

  - type: input
    id: spatial
    attributes:
      label: Spatial — 0 to 15
      placeholder: "e.g. 12.5"
    validations:
      required: true

  - type: input
    id: interaction
    attributes:
      label: Interaction — 0 to 10
      placeholder: "e.g. 8"
    validations:
      required: true

  - type: input
    id: originality
    attributes:
      label: VR Originality — 0 to 10
      placeholder: "e.g. 9"
    validations:
      required: true

  - type: input
    id: optimization
    attributes:
      label: Optimization — 0 to 10
      placeholder: "e.g. 8.5"
    validations:
      required: true

  - type: dropdown
    id: conflict
    attributes:
      label: Direct affiliation with this world?
      description: Select Yes if you are the creator, staff, group member, or otherwise directly affiliated. The review will be recorded but excluded from ranking calculations.
      options:
        - No
        - Yes — creator / staff / group member / direct affiliate
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Review notes
      description: Briefly explain the strongest and weakest parts of the world. This helps make scores auditable.
      placeholder: What stood out in the actual in-world experience?
    validations:
      required: true

  - type: checkboxes
    id: confirmations
    attributes:
      label: Required confirmations
      options:
        - label: I personally visited this world before submitting these scores.
          required: true
        - label: These scores reflect my own assessment using the seven published criteria.
          required: true
        - label: I have disclosed any direct creator / staff / group affiliation above.
          required: true
