  <header class="site-header">
    <a class="brand" href="index.html"><span class="brand-mark">VCC</span><span>VRC CLUB CHARTS</span></a>
    <nav class="nav">

  <main class="shell djs-page">
    <section class="djs-hero">
      <p class="kicker">DJ DIRECTORY</p>
      <h1>People behind<br><em>the sound.</em></h1>
      <p class="lead">VRChatの音楽シーンで活動するDJを、ジャンルと所属から探すためのディレクトリです。DJ自体の順位付けはしません。</p>
      <div class="djs-actions">

      </div>
    </section>

      <div class="section-heading">
        <div><p class="kicker">DIRECTORY BETA</p><h2>DJ / Artist</h2></div>
        <p id="djCount" class="section-note">Loading…</p>

      <div class="dj-controls">
        <div id="djFilters" class="chip-row dj-filters"></div>
        <label class="search-wrap"><span>⌕</span><input id="djSearch" type="search" placeholder="DJ名・所属・ジャンル" aria-label="Search DJs" /></label>
