  <meta name="robots" content="index,follow,max-image-preview:large" />
  <link rel="canonical" href="https://vrc-club-charts.vercel.app/events.html" />
  <meta property="og:title" content="VRChat Events — VRC Club Charts" />
  <meta property="og:description" content="Upcoming VRChat club, DJ and music events." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://vrc-club-charts.vercel.app/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

<body>
  <div class="noise"></div>
  <header class="site-header focus-header">
    <a class="brand" href="index.html"><span class="brand-mark">VCC</span><span>VRC CLUB CHARTS</span></a>
    <nav class="nav focus-nav">
      <a class="nav-link" href="index.html">Home</a>
      <a class="nav-link" href="worlds/">Worlds</a>
      <a class="nav-link active" href="events.html">Events</a>
      <a class="nav-link" href="reviewer.html">Reviews</a>
      <a class="nav-link" href="about.html">About</a>
    </nav>
  </header>

  <main class="shell events-page">
    <div class="events-hero">
      <p class="kicker">EVENT CALENDAR</p>
      <h1>Find your next<br><em>night out.</em></h1>
      <p class="lead">クラブイベント、DJセット、音楽コミュニティの予定をひとつに。気になる夜から、次の体験を見つけよう。</p>
      <div class="events-actions">
        <a class="primary-button" href="https://github.com/showchoo/vrc-club-charts/issues/new?template=event_submission.yml" target="_blank" rel="noreferrer">イベントを登録 ↗</a><a class="secondary-button" href="events.ics">ICSカレンダー ↓</a>
      </div>
    </div>

    <section>
      <div class="events-controls">
        <div class="events-filter-stack">
          <div id="eventSourceFilters" class="chip-row event-source-filters"></div>
          <div id="eventFilters" class="chip-row"></div>
        </div>
        <label class="search-wrap"><span>⌕</span><input id="eventSearch" type="search" placeholder="イベント名・主催・ジャンル" aria-label="Search events" /></label>
      </div>
      <div class="section-heading">
        <div>
          <p class="kicker">UPCOMING</p>
          <h2>開催予定</h2>
        </div>
        <p id="eventCount" class="section-note">Loading…</p>
      </div>
      <div id="eventGrid" class="event-grid"></div>
      <div id="eventEmpty" class="event-empty" hidden>
        <strong>該当するイベントがありません。</strong>
        <span>検索条件を変えるか、イベント情報を登録してください。</span>
      </div>
    </section>
  </main>

  <footer class="site-footer shell">
    <span>VRC CLUB CHARTS / INDEPENDENT</span>
    <span class="footer-links"><a href="index.html">Charts</a><a href="worlds/">Worlds</a><a href="djs.html">DJs</a><a href="about.html">About</a><a href="privacy.html">Privacy</a></span>
  </footer>
  <script src="events.js?v=20261005-23" defer></script>
</body>
</html>
